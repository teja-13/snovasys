spring:
  application:
    name: ledgerline-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerline}
    username: ${DB_USERNAME:ledgerline}
    password: ${DB_PASSWORD:ledgerline}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
