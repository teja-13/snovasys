spring:
  application:
    name: ledgerline-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/ledgerline}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:ledgerline}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:ledgerline}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

ledgerline:
  bootstrap-admin:
    full-name: ${LEDGERLINE_BOOTSTRAP_ADMIN_FULL_NAME:}
    email: ${LEDGERLINE_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${LEDGERLINE_BOOTSTRAP_ADMIN_PASSWORD:}
  redis:
    enabled: ${LEDGERLINE_REDIS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
