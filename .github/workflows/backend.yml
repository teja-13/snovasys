name: Backend build and test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ledgerline
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerline -d ledgerline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run backend tests
        run: ./mvnw --batch-mode verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ledgerline
          DB_USERNAME: ledgerline
          DB_PASSWORD: ledgerline
