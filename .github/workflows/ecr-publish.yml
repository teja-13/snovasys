name: Publish images to Amazon ECR

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  validate-backend:
    name: Validate backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ledgerline
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerline -d ledgerline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify backend
        run: ./mvnw --batch-mode verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ledgerline
          DB_USERNAME: ledgerline
          DB_PASSWORD: ledgerline

  validate-frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  publish:
    name: Build and publish ECR images
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontend]
    env:
      BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS account ID
        id: aws-account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKEND_REPOSITORY"
          test -n "$FRONTEND_REPOSITORY"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test -n "$account_id"
          echo "account-id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        env:
          IMAGE_URI: ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: docker build --tag "$IMAGE_URI" --file backend/Dockerfile backend

      - name: Push backend image
        env:
          IMAGE_URI: ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: docker push "$IMAGE_URI"

      - name: Build frontend image
        env:
          IMAGE_URI: ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.FRONTEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: docker build --tag "$IMAGE_URI" --file frontend/Dockerfile frontend

      - name: Push frontend image
        env:
          IMAGE_URI: ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.FRONTEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: docker push "$IMAGE_URI"

      - name: Report published image references
        run: |
          echo "Published backend image with tag ${IMAGE_TAG}"
          echo "Published frontend image with tag ${IMAGE_TAG}"

  deploy:
    name: Deploy to EC2 with SSM
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontend, publish]
    env:
      INSTANCE_ID: i-0cfccc5b93fc9970e
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deployment command to EC2
        id: send-command
        shell: bash
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          deployment_script="$(cat <<EOF
          set -e
          cd /home/ubuntu/ledgerline
          tag='${IMAGE_TAG}'
          if grep -q '^LEDGERLINE_IMAGE_TAG=' .env; then
            sed -i "s/^LEDGERLINE_IMAGE_TAG=.*/LEDGERLINE_IMAGE_TAG=\${tag}/" .env
          else
            printf '\nLEDGERLINE_IMAGE_TAG=%s\n' "\${tag}" >> .env
          fi
          docker compose pull backend frontend
          docker compose up -d --no-deps backend frontend
          docker compose ps --status running --services | grep -qx backend
          docker compose ps --status running --services | grep -qx frontend
          EOF
          )"
          jq -n --arg script "$deployment_script" '{commands: [$script], executionTimeout: ["900"]}' > ssm-parameters.json
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "LedgerLine deployment ${IMAGE_TAG}" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 900 \
            --query 'Command.CommandId' \
            --output text)"
          test -n "$command_id"
          echo "command-id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment command
        id: wait-command
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          command_id="${{ steps.send-command.outputs.command-id }}"
          deadline=$((SECONDS + 1850))
          terminal_status=""
          while (( SECONDS < deadline )); do
            set +e
            invocation="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>invocation-error.json)"
            aws_status=$?
            set -e

            if [ "$aws_status" -ne 0 ]; then
              if grep -q 'InvocationDoesNotExist' invocation-error.json; then
                echo "SSM invocation is not available yet; retrying in 10 seconds."
                sleep 10
                continue
              fi
              cat invocation-error.json >&2
              exit "$aws_status"
            fi

            status="$(jq -r '.Status' <<<"$invocation")"
            echo "SSM invocation status: $status"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|ExecutionTimedOut|DeliveryTimedOut|Undeliverable|Terminated)
                terminal_status="$status"
                break
                ;;
            esac
            sleep 10
          done

          if [ -z "$terminal_status" ]; then
            echo "SSM invocation did not reach a terminal state before the timeout." >&2
            exit 1
          fi
          echo "terminal-status=$terminal_status" >> "$GITHUB_OUTPUT"

      - name: Retrieve deployment output
        shell: bash
        run: |
          set -euo pipefail
          command_id="${{ steps.send-command.outputs.command-id }}"
          set +e
          invocation="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --output json 2>invocation-error.json)"
          aws_status=$?
          set -e
          if [ "$aws_status" -ne 0 ]; then
            cat invocation-error.json >&2
            exit "$aws_status"
          fi
          printf '%s\n' "$(jq -r '.StandardOutputContent // empty' <<<"$invocation")"
          stderr="$(jq -r '.StandardErrorContent // empty' <<<"$invocation")"
          if [ -n "$stderr" ]; then
            printf '%s\n' "$stderr" >&2
          fi
          invocation_status="$(jq -r '.Status' <<<"$invocation")"
          echo "SSM invocation status: $invocation_status"
          if [ "$invocation_status" != "Success" ]; then
            exit 1
          fi
          if [ "${{ steps.wait-command.outcome }}" != "success" ]; then
            exit 1
          fi
